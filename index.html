/* =====================================================================
   TESR ROI Studio — draw ROIs per camera, pick a task or model per ROI,
   then export config.json + tesr_vision_runner.py that runs on any OS
   ===================================================================== */

/* ROI colours: TESR gold and red lead the palette, the remaining hues are
   muted so the overlay stays in the brand family and still reads apart. */
const TASKS = {
  digits_7seg:  {color:"#E6CC81", model:false},
  ocr_text:     {color:"#D9A441", model:false},
  yolo_detect:  {color:"#F30006", model:true},
  yolo_classify:{color:"#FF7A6B", model:true},
  barcode_qr:   {color:"#7FD3E0", model:false},
  presence_diff:{color:"#86C97F", model:false},
  color_check:  {color:"#C89BD8", model:false},
};
const taskLabel = k => t("task_" + k);

const uid = p => p + "_" + Math.random().toString(36).slice(2, 7);

function defaultParams(task){
  switch(task){
    case "digits_7seg":  return {threshold_mode:"otsu", threshold:128, invert:false, blur:3,
                                 min_fill:0.5, split:"auto", digits:1, decimals:0, unit:"", as_number:true};
    case "ocr_text":     return {engine:"tesseract", lang:"eng", psm:7, whitelist:"", preprocess:true, invert:false};
    case "yolo_detect":  return {output:"count"};
    case "yolo_classify":return {};
    case "barcode_qr":   return {qr:true, barcode:true};
    case "presence_diff":return {sensitivity:25, min_ratio:0.05, reference:"first"};
    case "color_check":  return {h_min:0,h_max:10,s_min:120,s_max:255,v_min:80,v_max:255,min_ratio:0.2,output:"bool"};
    default: return {};
  }
}
function defaultModel(task){
  if(task === "yolo_detect")   return {path:"yolov8n.pt", conf:0.25, iou:0.45, imgsz:640, classes:[]};
  if(task === "yolo_classify") return {path:"yolov8n-cls.pt", imgsz:224};
  return null;
}

/* ------------------------------ state ------------------------------ */
const state = {
  project: "TESR Vision Project",
  runtime: {loop_fps:10, show_window:true, print_console:true, jsonl_log:"logs/results.jsonl",
            csv_log:"logs/results.csv", save_on_change:false, save_dir:"captures",
            mqtt:{enabled:false, host:"localhost", port:1883, topic_prefix:"tesr/vision", username:"", password:""},
            webhook:{enabled:false, url:""}},
  cameras: [],
  ci: 0,            // active camera index
  sel: null,        // selected roi id
  view: {scale:1, tx:0, ty:0, fitted:false},
};
const imgCache = new Map();   // camId -> HTMLImageElement

function newCamera(n){
  return {id:"cam"+n, name:"Camera "+n, source:String(n-1), width:1280, height:720, rotate:0,
          bg:null, rois:[]};
}
function cam(){ return state.cameras[state.ci]; }
function selRoi(){ const c = cam(); return c ? c.rois.find(r => r.id === state.sel) || null : null; }
function bgImage(){ const c = cam(); return c && c.bg ? imgCache.get(c.id) || null : null; }

/* ------------------------------ canvas ------------------------------ */
const cv = document.getElementById("view");
const ctx = cv.getContext("2d");
const wrap = document.getElementById("wrap");
let need = true;
let drag = null;          // declared here: draw() reads it before the mouse section loads
const invalidate = () => { need = true; };

function resize(){
  const r = wrap.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if(!state.view.fitted) fit();
  invalidate();
}
new ResizeObserver(resize).observe(wrap);

/* the canvas, the ROI maths and the export all measure against this */
function frameSize(){ return sourceSize(); }
function fit(){
  const r = wrap.getBoundingClientRect(), f = frameSize();
  const s = Math.min((r.width - 32) / f.w, (r.height - 32) / f.h);
  state.view.scale = s > 0 ? s : 1;
  state.view.tx = (r.width - f.w * state.view.scale) / 2;
  state.view.ty = (r.height - f.h * state.view.scale) / 2;
  state.view.fitted = true;
  invalidate();
}
const toImg = (sx, sy) => ({x:(sx - state.view.tx) / state.view.scale, y:(sy - state.view.ty) / state.view.scale});
const toScr = (ix, iy) => ({x: ix * state.view.scale + state.view.tx, y: iy * state.view.scale + state.view.ty});

/* rect in pixels (centre based) */
function rectPx(roi){
  const f = frameSize(), R = roi.rect;
  return {cx:(R.x + R.w/2) * f.w, cy:(R.y + R.h/2) * f.h, w:R.w * f.w, h:R.h * f.h,
          a:(R.angle || 0) * Math.PI / 180};
}
function setRectPx(roi, cx, cy, w, h, a){
  const f = frameSize();
  roi.rect.w = Math.max(6, w) / f.w;
  roi.rect.h = Math.max(6, h) / f.h;
  roi.rect.x = (cx - Math.max(6, w)/2) / f.w;
  roi.rect.y = (cy - Math.max(6, h)/2) / f.h;
  if(a !== undefined) roi.rect.angle = +(a * 180 / Math.PI).toFixed(2);
}
function corners(roi){
  const p = rectPx(roi), c = Math.cos(p.a), s = Math.sin(p.a);
  return [[-p.w/2,-p.h/2],[p.w/2,-p.h/2],[p.w/2,p.h/2],[-p.w/2,p.h/2]]
    .map(([dx,dy]) => ({x:p.cx + dx*c - dy*s, y:p.cy + dx*s + dy*c}));
}
function toLocal(roi, px, py){
  const p = rectPx(roi), c = Math.cos(-p.a), s = Math.sin(-p.a), dx = px - p.cx, dy = py - p.cy;
  return {x: dx*c - dy*s, y: dx*s + dy*c, p};
}
const HANDLES = [["nw",-1,-1],["n",0,-1],["ne",1,-1],["e",1,0],["se",1,1],["s",0,1],["sw",-1,1],["w",-1,0]];
function handlePoints(roi){
  const p = rectPx(roi), c = Math.cos(p.a), s = Math.sin(p.a), out = [];
  const put = (id, lx, ly) => out.push({id, x:p.cx + lx*c - ly*s, y:p.cy + lx*s + ly*c});
  HANDLES.forEach(([id,hx,hy]) => put(id, hx*p.w/2, hy*p.h/2));
  put("rot", 0, -p.h/2 - 26 / state.view.scale);
  return out;
}

let lastSizeText = "";
function updateEmptyOverlay(){
  const src = sourceEl();
  const el = document.getElementById("emptyMsg");
  if(el) el.style.display = src ? "none" : "flex";
  const f = frameSize();
  const txt = src ? f.w + " × " + f.h + (liveReady() ? "  (" + t("live") + ")" : "") : "—";
  if(txt !== lastSizeText){
    lastSizeText = txt;
    const st = document.getElementById("stSize");
    if(st) st.textContent = txt;
  }
}

function draw(){
  updateEmptyOverlay();
  const r = wrap.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  const f = frameSize(), v = state.view, src = sourceEl();

  ctx.save();
  ctx.translate(v.tx, v.ty);
  ctx.scale(v.scale, v.scale);
  if(src){
    try { ctx.drawImage(src, 0, 0, f.w, f.h); }
    catch(e){ /* a video frame can be momentarily unavailable */ }
  } else {
    ctx.fillStyle = "#141414"; ctx.fillRect(0, 0, f.w, f.h);
    ctx.strokeStyle = "#242424"; ctx.lineWidth = 1 / v.scale;
    for(let x = 0; x <= f.w; x += 80){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,f.h); ctx.stroke(); }
    for(let y = 0; y <= f.h; y += 80){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(f.w,y); ctx.stroke(); }
  }
  ctx.strokeStyle = "#454545"; ctx.lineWidth = 1 / v.scale; ctx.strokeRect(0, 0, f.w, f.h);
  ctx.restore();

  const c = cam();
  if(c) c.rois.forEach(roi => drawRoi(roi, roi.id === state.sel));
  if(drag && drag.mode === "create" && drag.box) drawGhost(drag.box);
  need = false;
}

function drawRoi(roi, active){
  const v = state.view, col = TASKS[roi.task] ? TASKS[roi.task].color : "#888";
  const res = live.results[roi.id];
  const pts = corners(roi).map(p => toScr(p.x, p.y));
  ctx.save();
  ctx.lineWidth = active ? 2 : 1.4;
  ctx.strokeStyle = roi.enabled === false ? "#5A5A5A" : col;
  ctx.globalAlpha = roi.enabled === false ? .55 : 1;
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for(let i = 1; i < 4; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = col + "14"; ctx.fill();

  /* corner brackets — the signature marker of a TESR ROI */
  const L = 12;
  ctx.lineWidth = active ? 3 : 2;
  for(let i = 0; i < 4; i++){
    const a = pts[i], b = pts[(i+1)%4], d = Math.hypot(b.x-a.x, b.y-a.y) || 1;
    const ux = (b.x-a.x)/d, uy = (b.y-a.y)/d, l = Math.min(L, d/3);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x+ux*l, a.y+uy*l); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x-ux*l, b.y-uy*l); ctx.stroke();
  }

  /* digit dividers for 7-segment ROIs */
  if(document.getElementById("chkGuide").checked && roi.task === "digits_7seg"){
    const n = +(roi.params.digits || 0);
    if(n > 1){
      const p = rectPx(roi), ca = Math.cos(p.a), sa = Math.sin(p.a);
      ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.strokeStyle = col + "99";
      for(let i = 1; i < n; i++){
        const lx = -p.w/2 + p.w * i / n;
        const t = toScr(p.cx + lx*ca + (p.h/2)*sa, p.cy + lx*sa - (p.h/2)*ca);
        const b = toScr(p.cx + lx*ca - (p.h/2)*sa, p.cy + lx*sa + (p.h/2)*ca);
        ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.setLineDash([]);
    }
  }

  if(document.getElementById("chkLabels").checked){
    const top = pts.reduce((m, p) => p.y < m.y ? p : m, pts[0]);
    const shown = res && res.value !== null && res.value !== undefined && res.value !== ""
                  ? String(res.value) : null;
    const txt = shown !== null ? roi.name + "  =  " + shown : roi.name + "  ·  " + roi.task;
    ctx.font = "11px ui-monospace, monospace";
    const w = ctx.measureText(txt).width + 10;
    ctx.fillStyle = "rgba(11,11,11,.88)";
    ctx.fillRect(top.x, top.y - 19, w, 16);
    ctx.fillStyle = col; ctx.fillRect(top.x, top.y - 19, 3, 16);
    ctx.fillStyle = "#F2F2F2"; ctx.fillText(txt, top.x + 7, top.y - 7);
  }

  if(res && res.items && res.items.length && res.crop){
    const p = rectPx(roi), ca = Math.cos(p.a), sa = Math.sin(p.a);
    const kx = p.w / res.crop.width, ky = p.h / res.crop.height;
    ctx.lineWidth = 1.5; ctx.strokeStyle = "#F30006";
    res.items.forEach(d => {
      const pts2 = [[d.box[0],d.box[1]],[d.box[2],d.box[1]],[d.box[2],d.box[3]],[d.box[0],d.box[3]]]
        .map(([bx,by]) => { const lx = bx*kx - p.w/2, ly = by*ky - p.h/2;
          return toScr(p.cx + lx*ca - ly*sa, p.cy + lx*sa + ly*ca); });
      ctx.beginPath(); ctx.moveTo(pts2[0].x, pts2[0].y);
      for(let i = 1; i < 4; i++) ctx.lineTo(pts2[i].x, pts2[i].y);
      ctx.closePath(); ctx.stroke();
    });
  }

  if(active){
    ctx.fillStyle = "#F2F2F2"; ctx.strokeStyle = "#101010"; ctx.lineWidth = 1;
    handlePoints(roi).forEach(h => {
      const s = toScr(h.x, h.y);
      if(h.id === "rot"){
        ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, 7); ctx.fill(); ctx.stroke();
      } else {
        ctx.fillRect(s.x - 4, s.y - 4, 8, 8); ctx.strokeRect(s.x - 4, s.y - 4, 8, 8);
      }
    });
  }
  ctx.restore();
}
function drawGhost(b){
  const a = toScr(b.x0, b.y0), c = toScr(b.x1, b.y1);
  ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle = "#F30006"; ctx.lineWidth = 1.5;
  ctx.strokeRect(a.x, a.y, c.x - a.x, c.y - a.y); ctx.restore();
}
function startRenderLoop(){
  (function loop(ts){
    if(live.on){
      invalidate();                                   // a video frame is always "new"
      if(live.infer && !live.busy && ts - live.last > 220){ live.last = ts; evalAll(); }
    }
    if(need) draw();
    requestAnimationFrame(loop);
  })(0);
}

/* ------------------------------ mouse ------------------------------ */

function hitTest(ix, iy){
  const c = cam(); if(!c) return null;
  const sel = selRoi();
  if(sel){
    const tol = 9 / state.view.scale;
    for(const h of handlePoints(sel)){
      if(Math.abs(h.x - ix) < tol && Math.abs(h.y - iy) < tol) return {roi:sel, handle:h.id};
    }
  }
  for(let i = c.rois.length - 1; i >= 0; i--){
    const l = toLocal(c.rois[i], ix, iy);
    if(Math.abs(l.x) <= l.p.w/2 && Math.abs(l.y) <= l.p.h/2) return {roi:c.rois[i], handle:"move"};
  }
  return null;
}

cv.addEventListener("pointerdown", e => {
  if(!cam()) return;
  cv.setPointerCapture(e.pointerId);
  const r = cv.getBoundingClientRect(), p = toImg(e.clientX - r.left, e.clientY - r.top);
  if(e.button === 1 || e.shiftKey){ drag = {mode:"pan", sx:e.clientX, sy:e.clientY, tx:state.view.tx, ty:state.view.ty}; return; }
  const hit = hitTest(p.x, p.y);
  if(hit){
    select(hit.roi.id);
    const g = rectPx(hit.roi);
    drag = {mode: hit.handle === "move" ? "move" : (hit.handle === "rot" ? "rotate" : "resize"),
            handle: hit.handle, roi: hit.roi, start: p, g};
  } else {
    select(null);
    drag = {mode:"create", box:{x0:p.x, y0:p.y, x1:p.x, y1:p.y}};
  }
  invalidate();
});

cv.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect(), p = toImg(e.clientX - r.left, e.clientY - r.top);
  const f = frameSize();
  document.getElementById("stCur").textContent =
    Math.round(p.x) + "," + Math.round(p.y) + " px  (" + (p.x/f.w*100).toFixed(1) + "%, " + (p.y/f.h*100).toFixed(1) + "%)";
  if(!drag) return;

  if(drag.mode === "pan"){
    state.view.tx = drag.tx + (e.clientX - drag.sx);
    state.view.ty = drag.ty + (e.clientY - drag.sy);
  } else if(drag.mode === "create"){
    drag.box.x1 = p.x; drag.box.y1 = p.y;
  } else if(drag.mode === "move"){
    const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
    setRectPx(drag.roi, drag.g.cx + dx, drag.g.cy + dy, drag.g.w, drag.g.h);
  } else if(drag.mode === "rotate"){
    const g = drag.g, ang = Math.atan2(p.y - g.cy, p.x - g.cx) + Math.PI/2;
    setRectPx(drag.roi, g.cx, g.cy, g.w, g.h, e.ctrlKey ? ang : Math.round(ang*180/Math.PI/0.5)*0.5*Math.PI/180);
  } else if(drag.mode === "resize"){
    const g = drag.g, c = Math.cos(-g.a), s = Math.sin(-g.a);
    const mx = (p.x - g.cx)*c - (p.y - g.cy)*s, my = (p.x - g.cx)*s + (p.y - g.cy)*c;
    let l = -g.w/2, t = -g.h/2, rr = g.w/2, b = g.h/2;
    const H = drag.handle;
    if(H.includes("w")) l = Math.min(mx, rr - 6);
    if(H.includes("e")) rr = Math.max(mx, l + 6);
    if(H.includes("n")) t = Math.min(my, b - 6);
    if(H.includes("s")) b = Math.max(my, t + 6);
    const nw = rr - l, nh = b - t, lcx = (l + rr)/2, lcy = (t + b)/2;
    const ca = Math.cos(g.a), sa = Math.sin(g.a);
    setRectPx(drag.roi, g.cx + lcx*ca - lcy*sa, g.cy + lcx*sa + lcy*ca, nw, nh);
  }
  if(drag.mode !== "pan" && drag.mode !== "create"){ syncProps(); updatePreview(); }
  invalidate();
});

function endDrag(){
  if(drag && drag.mode === "create" && drag.box){
    const b = drag.box, f = frameSize();
    const w = Math.abs(b.x1 - b.x0), h = Math.abs(b.y1 - b.y0);
    if(w > 8 && h > 8) addRoi(Math.min(b.x0,b.x1)/f.w, Math.min(b.y0,b.y1)/f.h, w/f.w, h/f.h);
  }
  drag = null; invalidate();
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const before = toImg(mx, my);
  const k = e.deltaY < 0 ? 1.12 : 1/1.12;
  state.view.scale = Math.min(20, Math.max(0.05, state.view.scale * k));
  const after = toImg(mx, my);
  state.view.tx += (after.x - before.x) * state.view.scale;
  state.view.ty += (after.y - before.y) * state.view.scale;
  invalidate();
}, {passive:false});

document.addEventListener("keydown", e => {
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const roi = selRoi();
  if(e.key === "Escape"){ select(null); return; }
  if(!roi) return;
  if(e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); delRoi(roi.id); return; }
  if(e.key.toLowerCase() === "d" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); dupRoi(); return; }
  const step = (e.shiftKey ? 10 : 1), f = frameSize();
  const map = {ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step]};
  if(map[e.key]){
    e.preventDefault();
    roi.rect.x += map[e.key][0] / f.w;
    roi.rect.y += map[e.key][1] / f.h;
    syncProps(); updatePreview(); invalidate();
  }
});

/* ------------------------------ ROI ops ------------------------------ */
function addRoi(x, y, w, h){
  const c = cam(), task = document.getElementById("newTask").value;
  const n = c.rois.length + 1;
  const roi = {id: uid("roi"), name: task.split("_")[0] + "_" + n, enabled: true, task,
               rect:{x:+x.toFixed(4), y:+y.toFixed(4), w:+w.toFixed(4), h:+h.toFixed(4), angle:0},
               output_key: task.split("_")[0] + "_" + n, stable_frames: 2, every_n_frames: 1,
               upscale_to: task === "digits_7seg" ? 160 : 0,
               params: defaultParams(task)};
  const m = defaultModel(task); if(m) roi.model = m;
  c.rois.push(roi);
  select(roi.id); renderRoiList(); invalidate();
}
function delRoi(id){
  const c = cam(); c.rois = c.rois.filter(r => r.id !== id);
  if(state.sel === id) select(null);
  renderRoiList(); invalidate();
}
function dupRoi(){
  const r = selRoi(); if(!r) return;

/* ==================================================================
   Digit reader engine — identical maths to tesr_vision_runner.py, so a
   setting tuned here behaves the same once it runs on the edge device.
   ================================================================== */


function boxBlur(src, w, h, k){
  if(k < 3) return src;
  const r = (k - 1) >> 1, out = new Uint8ClampedArray(src.length);
  // separable box blur: two 1-D passes instead of one k*k window
  const tmp = new Float32Array(src.length);
  for(let y = 0; y < h; y++){
    let acc = 0, n = 0;
    for(let x = -r; x <= r; x++){ if(x >= 0 && x < w){ acc += src[y*w + x]; n++; } }
    for(let x = 0; x < w; x++){
      tmp[y*w + x] = acc / n;
      const out_ = x - r, in_ = x + r + 1;
      if(out_ >= 0){ acc -= src[y*w + out_]; n--; }
      if(in_ < w){ acc += src[y*w + in_]; n++; }
    }
  }
  for(let x = 0; x < w; x++){
    let acc = 0, n = 0;
    for(let y = -r; y <= r; y++){ if(y >= 0 && y < h){ acc += tmp[y*w + x]; n++; } }
    for(let y = 0; y < h; y++){
      out[y*w + x] = acc / n;
      const out_ = y - r, in_ = y + r + 1;
      if(out_ >= 0){ acc -= tmp[out_*w + x]; n--; }
      if(in_ < h){ acc += tmp[in_*w + x]; n++; }
    }
  }
  return out;
}

function otsu(g){
  const hist = new Array(256).fill(0);
  for(let i = 0; i < g.length; i++) hist[g[i]]++;
  const total = g.length;
  let sum = 0; for(let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = -1, thr = 128;
  for(let i = 0; i < 256; i++){
    wB += hist[i]; if(!wB) continue;
    const wF = total - wB; if(!wF) break;
    sumB += i * hist[i];
    const mB = sumB / wB, mF = (sum - sumB) / wF, between = wB * wF * (mB - mF) ** 2;
    if(between > best){ best = between; thr = i; }
  }
  return thr;
}

/* local mean via integral image -> adaptive threshold that stays fast on big ROIs */
function adaptive(g, w, h, radius, c){
  const I = new Float64Array((w + 1) * (h + 1));
  for(let y = 0; y < h; y++){
    let row = 0;
    for(let x = 0; x < w; x++){
      row += g[y*w + x];
      I[(y+1)*(w+1) + (x+1)] = I[y*(w+1) + (x+1)] + row;
    }
  }
  const out = new Uint8Array(w * h);
  for(let y = 0; y < h; y++){
    const y0 = Math.max(0, y - radius), y1 = Math.min(h - 1, y + radius);
    for(let x = 0; x < w; x++){
      const x0 = Math.max(0, x - radius), x1 = Math.min(w - 1, x + radius);
      const area = (y1 - y0 + 1) * (x1 - x0 + 1);
      const s = I[(y1+1)*(w+1) + (x1+1)] - I[y0*(w+1) + (x1+1)]
              - I[(y1+1)*(w+1) + x0] + I[y0*(w+1) + x0];
      out[y*w + x] = g[y*w + x] > (s / area - c) ? 255 : 0;
    }
  }
  return out;
}

function binarizeJS(gray, w, h, p){
  const blurred = boxBlur(gray, w, h, Math.min(9, +p.blur || 1));
  let out;
  if(p.threshold_mode === "adaptive"){
    out = adaptive(blurred, w, h, Math.max(3, Math.round(h * 0.25)), +p.c || 6);
  } else {
    const t = p.threshold_mode === "fixed" ? (+p.threshold || 128) : otsu(blurred);
    out = new Uint8Array(w * h);
    for(let i = 0; i < out.length; i++) out[i] = blurred[i] > t ? 255 : 0;
  }
  if(p.invert) for(let i = 0; i < out.length; i++) out[i] = 255 - out[i];
  return out;
}

const SEG_BOXES = [[0.18,0,0.82,0.16],[0,0.10,0.24,0.46],[0.76,0.10,1,0.46],[0.18,0.42,0.82,0.58],
                   [0,0.54,0.24,0.90],[0.76,0.54,1,0.90],[0.18,0.84,0.82,1]];
const SEG_HORIZ = [true,false,false,true,false,false,true];
const SEG_TABLE = {"1110111":"0","0010010":"1","1011101":"2","1011011":"3","0111010":"4","1101011":"5",
                   "1101111":"6","1010010":"7","1111111":"8","1111011":"9","0001000":"-","0000000":""};

function splitDigitsJS(bin, w, h, gapRatio){
  const col = new Int32Array(w);
  for(let x = 0; x < w; x++){ let c = 0; for(let y = 0; y < h; y++) if(bin[y*w+x]) c++; col[x] = c; }
  const thr = Math.max(1, Math.round(0.03 * h)), runs = [];
  let s = null;
  for(let x = 0; x < w; x++){
    if(col[x] > thr && s === null) s = x;
    else if(col[x] <= thr && s !== null){ runs.push([s, x]); s = null; }
  }
  if(s !== null) runs.push([s, w]);
  const minGap = Math.max(2, Math.round((gapRatio || 0.12) * h)), merged = [];
  runs.forEach(r => {
    if(merged.length && r[0] - merged[merged.length-1][1] < minGap) merged[merged.length-1][1] = r[1];
    else merged.push([r[0], r[1]]);
  });
  const boxes = [];
  merged.forEach(([x0, x1]) => {
    if(x1 - x0 < Math.max(2, 0.04*h)) return;
    let y0 = -1, y1 = -1;
    for(let y = 0; y < h; y++){
      let any = false;
      for(let x = x0; x < x1; x++) if(bin[y*w+x]){ any = true; break; }
      if(any){ if(y0 < 0) y0 = y; y1 = y + 1; }
    }
    if(y0 < 0 || (y1 - y0) < 0.30*h) return;
    boxes.push([x0, y0, x1, y1]);
  });
  if(boxes.length){
    const tall = Math.max(...boxes.map(b => b[3]-b[1]));
    return boxes.filter(b => (b[3]-b[1]) > 0.55*tall);
  }
  return boxes;
}

function readCellJS(bin, w, box, minFill){
  const [x0, y0, x1, y1] = box, cw = x1 - x0, ch = y1 - y0;
  if(ch < 8 || cw < 2) return ["", 0];
  let ink = 0;
  for(let y = y0; y < y1; y++) for(let x = x0; x < x1; x++) if(bin[y*w+x]) ink++;
  if(cw < 0.34*ch && ink/(cw*ch) > 0.20) return ["1", 1];
  let key = "", margin = 0;
  SEG_BOXES.forEach((b, i) => {
    const ax0 = x0 + Math.floor(b[0]*cw), ay0 = y0 + Math.floor(b[1]*ch);
    const ax1 = Math.max(ax0+1, x0 + Math.floor(b[2]*cw)), ay1 = Math.max(ay0+1, y0 + Math.floor(b[3]*ch));
    let best = 0;
    if(SEG_HORIZ[i]){
      for(let y = ay0; y < ay1; y++){ let c = 0;
        for(let x = ax0; x < ax1; x++) if(bin[y*w+x]) c++;
        best = Math.max(best, c/(ax1-ax0)); }
    } else {
      for(let x = ax0; x < ax1; x++){ let c = 0;
        for(let y = ay0; y < ay1; y++) if(bin[y*w+x]) c++;
        best = Math.max(best, c/(ay1-ay0)); }
    }
    key += best >= minFill ? "1" : "0";
    margin += Math.abs(best - minFill);
  });
  const ch_ = SEG_TABLE[key];
  return ch_ === undefined ? ["?", 0] : [ch_, Math.min(1, margin/7*2.5)];
}

/* one full read: gray -> {text, conf, boxes, bin} */
function readDigits(gray, w, h, p){
  const bin = binarizeJS(gray, w, h, p);
  let boxes = (p.split !== "fixed") ? splitDigitsJS(bin, w, h, p.min_gap_ratio) : [];
  const want = +p.digits || 0;
  if(p.split !== "fixed" && want && boxes.length !== want) boxes = [];
  if(!boxes.length){
    const n = want || 4, cw = Math.floor(w / n);
    boxes = Array.from({length: n}, (_, i) => [i*cw, 0, (i+1)*cw, h]);
  }
  let text = "", conf = 0;
  boxes.forEach(b => { const [c, cf] = readCellJS(bin, w, b, +p.min_fill || 0.5); text += c; conf += cf; });
  conf = boxes.length ? conf / boxes.length : 0;
  return {text, conf, boxes, bin};
}

/* -------------------------------------------------------------------
   Diagnostics: explain WHY a reading is unreliable, in plain language.
   ------------------------------------------------------------------- */
function diagnose(gray, w, h, p, result){
  const out = [];
  const n = gray.length;
  let sum = 0, sat = 0, black = 0;
  const hist = new Array(256).fill(0);
  for(let i = 0; i < n; i++){ const v = gray[i]; sum += v; hist[v]++; if(v > 250) sat++; if(v < 5) black++; }
  const mean = sum / n;
  let acc = 0, p05 = 0, p95 = 255;
  for(let i = 0; i < 256; i++){ acc += hist[i];
    if(!p05 && acc > n * 0.05) p05 = i;
    if(acc > n * 0.95){ p95 = i; break; } }
  const spread = p95 - p05;

  const add = (level, msg, fix) => out.push({level, msg, fix});

  if(h < 40) add("bad", t("dRoiShort") + h + t("dRoiShortPx"), t("dRoiShortFix"));
  else if(h < 70) add("warn", t("dRoiSmall") + h + t("dRoiSmall2"), t("dRoiSmallFix"));

  if(sat / n > 0.15) add("bad", t("dOver") + (100*sat/n).toFixed(0) + t("dOver2"), t("dOverFix"));
  if(black / n > 0.55 && mean < 25) add("warn", t("dDark") + mean.toFixed(0), t("dDarkFix"));
  if(spread < 45) add("bad", t("dContrast") + spread, t("dContrastFix"));

  const groups = splitDigitsJS(result.bin, w, h, p.min_gap_ratio).length;
  const want = +p.digits || 0;
  if(want && groups && groups !== want)
    add("warn", t("dGroups1") + groups + t("dGroups2") + want + t("dGroups3"),
        groups > want ? t("dGroupsMoreA") + groups + t("dGroupsMoreB") : t("dGroupsFewer"));
  if(!groups) add("bad", t("dNoGroups"), t("dNoGroupsFix"));

  if(result.text.includes("?"))
    add("warn", t("dUnread") + (result.text.match(/\?/g) || []).length + t("dUnread2"), t("dUnreadFix"));
  if(result.conf < 0.35 && !result.text.includes("?"))
    add("warn", t("dLowConf") + result.conf.toFixed(2), t("dLowConfFix"));

  if(!out.length) add("ok", t("dOk"), t("dOkFix"));
  return {mean, sat: sat/n, spread, groups, notes: out};
}

/* -------------------------------------------------------------------
   Auto-tune: sweep the parameters that actually matter and keep the
   setting that reads a valid number with the widest safety margin.
   ------------------------------------------------------------------- */
/* nearest-neighbour downscale so the sweep stays under ~150 ms on a Pi-class laptop */
function shrinkGray(gray, w, h, maxH){
  if(h <= maxH) return {gray, w, h};
  const s = maxH / h, nw = Math.max(8, Math.round(w * s)), nh = maxH;
  const out = new Uint8ClampedArray(nw * nh);
  for(let y = 0; y < nh; y++){
    const sy = Math.min(h - 1, Math.round(y / s));
    for(let x = 0; x < nw; x++) out[y*nw + x] = gray[sy*w + Math.min(w - 1, Math.round(x / s))];
  }
  return {gray: out, w: nw, h: nh};
}

/* Read using an already-computed binary image. binarize() does not depend on
   min_fill, so the sweep below computes it once per combination instead of
   once per threshold — about 30x less work. */
function readFromBin(bin, w, h, p){
  let boxes = (p.split !== "fixed") ? splitDigitsJS(bin, w, h, p.min_gap_ratio) : [];
  const want = +p.digits || 0;
  const autoGroups = boxes.length;
  if(p.split !== "fixed" && want && boxes.length !== want) boxes = [];
  if(!boxes.length){
    const n = want || 4, cw = Math.floor(w / n);
    boxes = Array.from({length: n}, (_, i) => [i*cw, 0, (i+1)*cw, h]);
  }
  let text = "", conf = 0;
  boxes.forEach(b => { const [c, cf] = readCellJS(bin, w, b, +p.min_fill || 0.5); text += c; conf += cf; });
  return {text, conf: boxes.length ? conf / boxes.length : 0, boxes, bin, autoGroups};
}

/* The best setting is not the one that merely reads correctly once — it is the
   one that keeps reading the same value while the threshold drifts. For every
   combination we sweep min_fill finely and measure how WIDE the band of identical
   valid readings is, then sit in the middle of the widest band. That width is
   also the honest answer to "how much lighting change can this survive". */
function autoTune(grayFull, wFull, hFull, base){
  const sm = shrinkGray(grayFull, wFull, hFull, 110);
  const gray = sm.gray, w = sm.w, h = sm.h;
  const want = +base.digits || 0;

  const modes = [{threshold_mode:"otsu"}, {threshold_mode:"adaptive", c:6}, {threshold_mode:"adaptive", c:12}];
  for(let t = 70; t <= 200; t += 26) modes.push({threshold_mode:"fixed", threshold:t});

  const FILLS = [];
  for(let f = 0.20; f <= 0.801; f += 0.02) FILLS.push(Math.round(f * 100) / 100);

  let best = null, fallback = null;
  for(const mode of modes)
  for(const invert of [false, true])
  for(const blur of [1, 3, 5]){
    const p0 = Object.assign({}, base, mode, {invert, blur, split: base.split || "auto"});
    let bin;
    try { bin = binarizeJS(gray, w, h, p0); } catch(e){ continue; }

    // Wrong polarity floods the gaps between digits: the picture goes almost
    // solid and every cell reads as an 8. Reject that before it wins on width.
    let ink = 0;
    for(let i = 0; i < bin.length; i++) if(bin[i]) ink++;
    const inkRatio = ink / bin.length;
    if(inkRatio > 0.72 || inkRatio < 0.015) continue;

    const groups = splitDigitsJS(bin, w, h, p0.min_gap_ratio).length;
    const groupsOk = !want || groups === want;

    const readings = FILLS.map(f => {
      const r = readFromBin(bin, w, h, Object.assign({}, p0, {min_fill: f}));
      const digits = r.text.replace(/[.\-]/g, "");
      const valid = digits.length > 0 && !r.text.includes("?") && (!want || digits.length === want);
      return {f, text: r.text, conf: r.conf, valid};
    });

    let runStart = -1, bestRun = null;
    for(let i = 0; i <= readings.length; i++){
      const cont = i < readings.length && readings[i].valid &&
                   (runStart >= 0 ? readings[i].text === readings[runStart].text : true);
      if(cont){ if(runStart < 0) runStart = i; }
      else if(runStart >= 0){
        const run = {from: runStart, to: i - 1};
        if(!bestRun || (run.to - run.from) > (bestRun.to - bestRun.from)) bestRun = run;
        runStart = (i < readings.length && readings[i].valid) ? i : -1;
      }
    }

    if(bestRun){
      const mid = Math.floor((bestRun.from + bestRun.to) / 2);
      const band = FILLS[bestRun.to] - FILLS[bestRun.from];
      let score = band * 100 + readings[mid].conf * 12;
      if(groupsOk) score += 40;            // the splitter agreeing is strong evidence of correct polarity
      else score -= 30;
      if(blur === 3) score += 1.5;
      if(mode.threshold_mode === "otsu") score += 1.5;
      const cand = {score, band, groupsOk,
                    params: Object.assign({}, p0, {min_fill: FILLS[mid]}),
                    text: readings[mid].text};
      if(!best || score > best.score) best = cand;
    } else if(groupsOk){
      const mid = readings[Math.floor(readings.length / 2)];
      const cand = {score: -100 + mid.conf, band: 0, groupsOk,
                    params: Object.assign({}, p0, {min_fill: 0.5}), text: mid.text};
      if(!fallback || cand.score > fallback.score) fallback = cand;
    }
  }

  const pick = best || fallback;
  if(!pick) return null;
  const full = readDigits(grayFull, wFull, hFull, pick.params);
  return {
    params: pick.params,
    result: full,
    band: pick.band,
    robust: pick.band >= 0.16 ? "high" : pick.band >= 0.08 ? "medium" : pick.band > 0 ? "low" : "none",
    agrees: full.text === pick.text,
    groupsOk: pick.groupsOk,
    tunedOn: {w, h}
  };
}

/* ==================================================================
   Model runtime — ONNX exported from Ultralytics, executed in-browser
   ================================================================== */


/* Letterbox: resize keeping aspect ratio, pad the rest with grey.
   Returns the CHW float tensor plus the mapping needed to put boxes back. */
function letterbox(rgba, sw, sh, size, pad){
  const scale = Math.min(size / sw, size / sh);
  const nw = Math.round(sw * scale), nh = Math.round(sh * scale);
  const dx = Math.floor((size - nw) / 2), dy = Math.floor((size - nh) / 2);
  const fill = (pad === undefined ? 114 : pad) / 255;

  const area = size * size;
  const t = new Float32Array(3 * area);
  t.fill(fill);

  for(let y = 0; y < nh; y++){
    const sy = Math.min(sh - 1, Math.floor(y / scale));
    for(let x = 0; x < nw; x++){
      const sx = Math.min(sw - 1, Math.floor(x / scale));
      const si = (sy * sw + sx) * 4;
      const di = (y + dy) * size + (x + dx);
      t[di] = rgba[si] / 255;                 // R
      t[area + di] = rgba[si + 1] / 255;      // G
      t[2 * area + di] = rgba[si + 2] / 255;  // B
    }
  }
  return {data: t, size, scale, dx, dy};
}

function iou(a, b){
  const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]);
  const x2 = Math.min(a[2], b[2]), y2 = Math.min(a[3], b[3]);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  if(inter <= 0) return 0;
  const areaA = (a[2] - a[0]) * (a[3] - a[1]), areaB = (b[2] - b[0]) * (b[3] - b[1]);
  return inter / (areaA + areaB - inter);
}

function nms(dets, thr){
  const out = [];
  dets.sort((p, q) => q.conf - p.conf);
  for(const d of dets){
    let keep = true;
    for(const k of out){
      if(k.classId === d.classId && iou(d.box, k.box) > thr){ keep = false; break; }
    }
    if(keep) out.push(d);
  }
  return out;
}

/* Decode an Ultralytics detect head.
   Accepts [1, 4+nc, N] (the usual export) and [1, N, 4+nc] (transposed).
   Coordinates come back in the ORIGINAL crop's pixel space. */
function decodeDetect(raw, dims, lb, opts){
  const conf = opts.conf === undefined ? 0.25 : opts.conf;
  const iouThr = opts.iou === undefined ? 0.45 : opts.iou;
  const names = opts.names || [];

  let nAttr, nBox, at;
  if(dims.length === 3){
    const [, d1, d2] = dims;
    if(d1 <= d2){ nAttr = d1; nBox = d2; at = (a, i) => raw[a * nBox + i]; }
    else        { nAttr = d2; nBox = d1; at = (a, i) => raw[i * nAttr + a]; }
  } else {
    throw new Error("unexpected output rank " + dims.length + " — expected [1, 4+nc, N]");
  }
  const nc = nAttr - 4;
  if(nc < 1) throw new Error("output has " + nAttr + " attributes, too few for boxes + classes");

  const dets = [];
  for(let i = 0; i < nBox; i++){
    let bestC = 0, bestS = 0;
    for(let c = 0; c < nc; c++){ const s = at(4 + c, i); if(s > bestS){ bestS = s; bestC = c; } }
    if(bestS < conf) continue;
    const cx = at(0, i), cy = at(1, i), w = at(2, i), h = at(3, i);
    // undo the letterbox: subtract padding, divide by scale
    const x1 = (cx - w / 2 - lb.dx) / lb.scale, y1 = (cy - h / 2 - lb.dy) / lb.scale;
    const x2 = (cx + w / 2 - lb.dx) / lb.scale, y2 = (cy + h / 2 - lb.dy) / lb.scale;
    dets.push({classId: bestC, name: names[bestC] || String(bestC),
               conf: bestS, box: [x1, y1, x2, y2]});
  }
  return nms(dets, iouThr);
}

/* Classification head: [1, nc] logits or probabilities. */
function decodeClassify(raw, dims, names){
  const n = dims[dims.length - 1];
  let sum = 0, isProb = true;
  for(let i = 0; i < n; i++){ const v = raw[i]; if(v < 0 || v > 1) isProb = false; sum += v; }
  let probs;
  if(isProb && Math.abs(sum - 1) < 0.05){
    probs = Array.from(raw.slice(0, n));
  } else {
    let mx = -Infinity;
    for(let i = 0; i < n; i++) mx = Math.max(mx, raw[i]);
    let z = 0; probs = new Array(n);
    for(let i = 0; i < n; i++){ probs[i] = Math.exp(raw[i] - mx); z += probs[i]; }
    for(let i = 0; i < n; i++) probs[i] /= z;
  }
  let best = 0;
  for(let i = 1; i < n; i++) if(probs[i] > probs[best]) best = i;
  return {classId: best, name: (names && names[best]) || String(best), conf: probs[best], probs};
}

/* ---------------- ONNX engine, fetched once, only when first needed --- */
const ORT_URLS = [
  "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js",
  "https://unpkg.com/onnxruntime-web@1.19.2/dist/ort.min.js"
];
let ortReady = null;
function setOrtStatus(msg, ok){
  const el = P("ortStatus");
  if(el){ el.textContent = msg; el.style.color = ok ? "var(--tesr-gold)" : "var(--dim)"; }
}
function loadOrt(){
  if(ortReady) return ortReady;
  ortReady = new Promise((resolve, reject) => {
    if(window.ort){ setOrtStatus(t("ortReady"), true); return resolve(window.ort); }
    let i = 0;
    const tryNext = () => {
      if(i >= ORT_URLS.length){
        ortReady = null;
        setOrtStatus(t("ortFailed"));
        return reject(new Error(t("ortErr")));
      }
      const sc = document.createElement("script");
      sc.src = ORT_URLS[i++];
      sc.onload = () => { setOrtStatus(t("ortReady"), true); resolve(window.ort); };
      sc.onerror = tryNext;
      document.head.appendChild(sc);
    };
    setOrtStatus(t("ortLoading"));
    setTimeout(() => { if(ortReady){ ortReady = null;
      setOrtStatus(t("ortTimeout"));
      reject(new Error(t("ortErrTimeout"))); } }, 20000);
    tryNext();
  });
  return ortReady;
}

/* ==================================================================
   1-D barcode decoder — Code 128, EAN-13 / UPC-A / EAN-8, Code 39, ITF.
   Bundled so barcode reading works in every browser, online or not.
   ================================================================== */


/* ---------- Code 128 ---------- */
/* Each symbol is 11 modules as 6 alternating widths (bar,space,bar,space,bar,space). */
const C128_PATTERNS = [
  "212222","222122","222221","121223","121322","131222","122213","122312","132212","221213",
  "221312","231212","112232","122132","122231","113222","123122","123221","223211","221132",
  "221231","213212","223112","312131","311222","321122","321221","312212","322112","322211",
  "212123","212321","232121","111323","131123","131321","112313","132113","132311","211313",
  "231113","231311","112133","112331","132131","113123","113321","133121","313121","211331",
  "231131","213113","213311","213131","311123","311321","331121","312113","312311","332111",
  "314111","221411","431111","111224","111422","121124","121421","141122","141221","112214",
  "112412","122114","122411","142112","142211","241211","221114","413111","241112","134111",
  "111242","121142","121241","114212","124112","124211","411212","421112","421211","212141",
  "214121","412121","111143","111341","131141","114113","114311","411113","411311","113141",
  "114131","311141","411131","211412","211214","211232","2331112"
];
const C128_STOP = 106;
const C128_A = "\u0000\u0001\u0002\u0003\u0004\u0005\u0006\u0007\b\t\n\u000b\f\r\u000e\u000f" +
               "\u0010\u0011\u0012\u0013\u0014\u0015\u0016\u0017\u0018\u0019\u001a\u001b\u001c\u001d\u001e\u001f";
function c128Char(set, code){
  if(code < 0 || code > 102) return null;
  if(set === "C") return code <= 99 ? String(code).padStart(2, "0") : null;
  if(code <= 95){
    if(set === "B") return String.fromCharCode(code + 32);
    return code < 64 ? String.fromCharCode(code + 32) : C128_A[code - 64];  // set A
  }
  return "";   // FNC / shift codes carry no printable character
}

/* ---------- Code 39 ---------- */
const C39 = {
  "0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw",
  "5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn",
  "A":"wnnnnwnnw","B":"nnwnnwnnw","C":"wnwnnwnnn","D":"nnnnwwnnw","E":"wnnnwwnnn",
  "F":"nnwnwwnnn","G":"nnnnnwwnw","H":"wnnnnwwnn","I":"nnwnnwwnn","J":"nnnnwwwnn",
  "K":"wnnnnnnww","L":"nnwnnnnww","M":"wnwnnnnwn","N":"nnnnwnnww","O":"wnnnwnnwn",
  "P":"nnwnwnnwn","Q":"nnnnnnwww","R":"wnnnnnwwn","S":"nnwnnnwwn","T":"nnnnwnwwn",
  "U":"wwnnnnnnw","V":"nwwnnnnnw","W":"wwwnnnnnn","X":"nwnnwnnnw","Y":"wwnnwnnnn",
  "Z":"nwwnwnnnn","-":"nwnnnnwnw",".":"wwnnnnwnn"," ":"nwwnnnwnn","*":"nwnnwnwnn",
  "$":"nwnwnwnnn","/":"nwnwnnnwn","+":"nwnnnwnwn","%":"nnnwnwnwn"
};
const C39_REV = {};
for(const k in C39) C39_REV[C39[k]] = k;

/* ---------- EAN / UPC ---------- */
const EAN_L = ["0001101","0011001","0010011","0111101","0100011",
               "0110001","0101111","0111011","0110111","0001011"];
const EAN_G = EAN_L.map(s => s.split("").reverse().map(c => c === "0" ? "1" : "0").join(""));
const EAN_R = EAN_L.map(s => s.split("").map(c => c === "0" ? "1" : "0").join(""));
const EAN_PARITY = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG",
                    "LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];

/* ---------- shared helpers ---------- */

/* one already-binarized row -> alternating run lengths, and whether it starts on a bar */
function runsOfLine(row, w){
  const runs = [];
  let cur = row[0], len = 0;
  const firstIsBar = cur === 1;
  for(let x = 0; x < w; x++){
    const v = row[x];
    if(v === cur) len++;
    else { runs.push(len); cur = v; len = 1; }
  }
  runs.push(len);
  return {runs, firstIsBar};
}

/* threshold one row on its own so uneven lighting across a label is tolerated */
function binarizeRow(gray, w, h, y){
  let lo = 255, hi = 0;
  for(let x = 0; x < w; x++){ const v = gray[y*w + x]; if(v < lo) lo = v; if(v > hi) hi = v; }
  if(hi - lo < 30) return null;                       // no bars on this line
  const t = (lo + hi) / 2;
  const out = new Uint8Array(w);
  for(let x = 0; x < w; x++) out[x] = gray[y*w + x] < t ? 1 : 0;   // 1 = bar (dark)
  return out;
}

/* widths -> "212222" style pattern.
   Rounding each width on its own breaks down once a module is only 2-3 px wide,
   because the errors can add up to the wrong total. So round, then nudge the
   entries with the largest rounding error until the modules sum exactly right. */
function widthsToPattern(widths, modules){
  const sum = widths.reduce((a, b) => a + b, 0);
  if(sum <= 0) return null;
  const unit = sum / modules;
  const exact = widths.map(w => w / unit);
  const n = exact.map(v => Math.max(1, Math.min(4, Math.round(v))));
  let total = n.reduce((a, b) => a + b, 0);

  let guard = 0;
  while(total !== modules && guard++ < 12){
    const up = total < modules;
    let bestI = -1, bestErr = -Infinity;
    for(let i = 0; i < n.length; i++){
      if(up && n[i] >= 4) continue;
      if(!up && n[i] <= 1) continue;
      // how much this entry wants to move in the needed direction
      const err = up ? (exact[i] - n[i]) : (n[i] - exact[i]);
      if(err > bestErr){ bestErr = err; bestI = i; }
    }
    if(bestI < 0) return null;
    n[bestI] += up ? 1 : -1;
    total += up ? 1 : -1;
  }
  if(total !== modules) return null;
  // reject if any width had to move more than half a module: that is noise, not a symbol
  for(let i = 0; i < n.length; i++) if(Math.abs(exact[i] - n[i]) > 0.65) return null;
  return n.join("");
}

/* ---------- Code 128 ---------- */
function decodeCode128(runs, firstIsBar){
  // a Code 128 symbol always starts with a bar
  let idx = firstIsBar ? 0 : 1;
  const seq = runs.slice(idx);
  if(seq.length < 6 * 4) return null;

  const codes = [];
  let i = 0;
  while(i + 6 <= seq.length){
    const pat = widthsToPattern(seq.slice(i, i + 6), 11);
    if(pat === null) break;
    const code = C128_PATTERNS.indexOf(pat);
    if(code < 0 || code > 105) break;
    codes.push(code);
    i += 6;
    if(code === C128_STOP) break;
  }
  if(codes.length < 4) return null;

  // the stop symbol is 13 modules (7 widths); accept either encoding of it
  if(codes[codes.length - 1] !== C128_STOP){
    const tail = widthsToPattern(seq.slice(i, i + 7), 13);
    if(tail !== "2331112") return null;
    codes.push(C128_STOP);
  }

  const start = codes[0];
  if(start < 103 || start > 105) return null;
  let set = ["A","B","C"][start - 103];

  // modulo-103 checksum over start + weighted data
  const payload = codes.slice(0, codes.length - 2);       // drop check + stop
  const check = codes[codes.length - 2];
  let sum = payload[0];
  for(let k = 1; k < payload.length; k++) sum += k * payload[k];
  if(sum % 103 !== check) return null;

  let text = "";
  for(let k = 1; k < payload.length; k++){
    const c = payload[k];
    if(c === 99){ set = "C"; continue; }
    if(c === 100){ set = set === "B" ? "A" : "B"; continue; }
    if(c === 101){ set = set === "A" ? "B" : "A"; continue; }
    const ch = c128Char(set, c);
    if(ch === null) return null;
    text += ch;
  }
  return text.length ? {text, format: "code_128"} : null;
}

/* ---------- Code 39 ---------- */
function decodeCode39(runs, firstIsBar){
  let seq = runs, off = firstIsBar ? 0 : 1;
  seq = seq.slice(off);
  const chars = [];
  let i = 0;
  while(i + 9 <= seq.length){
    const w = seq.slice(i, i + 9);
    const mx = Math.max(...w), mn = Math.min(...w);
    if(mx / mn < 1.5) return null;                       // no wide/narrow contrast
    const mid = (mx + mn) / 2;
    const key = w.map(v => v > mid ? "w" : "n").join("");
    const ch = C39_REV[key];
    if(ch === undefined) break;
    chars.push(ch);
    i += 9;
    if(i < seq.length) i += 1;                           // inter-character gap
  }
  if(chars.length < 3) return null;
  if(chars[0] !== "*" || chars[chars.length - 1] !== "*") return null;
  const text = chars.slice(1, -1).join("");
  return text.length ? {text, format: "code_39"} : null;
}

/* ---------- EAN-13 / UPC-A / EAN-8 ---------- */
function decodeEan(bin, w){
  // find the first dark pixel and measure the guard bars to get the module width
  let x0 = 0;
  while(x0 < w && !bin[x0]) x0++;
  if(x0 >= w - 20) return null;
  let x1 = w - 1;
  while(x1 > x0 && !bin[x1]) x1--;
  const span = x1 - x0 + 1;

  for(const modules of [95, 67]){                        // EAN-13/UPC-A, then EAN-8
    const unit = span / modules;
    if(unit < 0.8) continue;
    let bits = "";
    for(let m = 0; m < modules; m++){
      const cx = Math.round(x0 + (m + 0.5) * unit);
      bits += bin[Math.min(w - 1, Math.max(0, cx))] ? "1" : "0";
    }
    const digits = modules === 95 ? 6 : 4;
    if(bits.slice(0, 3) !== "101") continue;
    const mid = 3 + digits * 7;
    if(bits.slice(mid, mid + 5) !== "01010") continue;
    if(bits.slice(-3) !== "101") continue;

    let left = "", parity = "";
    for(let d = 0; d < digits; d++){
      const chunk = bits.substr(3 + d * 7, 7);
      let v = EAN_L.indexOf(chunk);
      if(v >= 0){ parity += "L"; }
      else { v = EAN_G.indexOf(chunk); if(v >= 0) parity += "G"; else return null; }
      left += v;
    }
    let right = "";
    for(let d = 0; d < digits; d++){
      const chunk = bits.substr(mid + 5 + d * 7, 7);
      const v = EAN_R.indexOf(chunk);
      if(v < 0) return null;
      right += v;
    }

    let text;
    if(modules === 95){
      const first = EAN_PARITY.indexOf(parity);
      if(first < 0) return null;
      text = String(first) + left + right;
    } else {
      if(parity !== "LLLL") return null;
      text = left + right;
    }

    // modulo-10 check digit
    const ds = text.split("").map(Number);
    let sum = 0;
    for(let i = 0; i < ds.length - 1; i++){
      const weight = (ds.length === 13)
        ? (i % 2 === 0 ? 1 : 3)
        : (i % 2 === 0 ? 3 : 1);
      sum += ds[i] * weight;
    }
    if((10 - sum % 10) % 10 !== ds[ds.length - 1]) return null;

    const isUpc = text.length === 13 && text[0] === "0";
    return {text: isUpc ? text.slice(1) : text,
            format: text.length === 13 ? (isUpc ? "upc_a" : "ean_13") : "ean_8"};
  }
  return null;
}

/* ---------- ITF (Interleaved 2 of 5) ---------- */
const ITF_DIGIT = ["nnwwn","wnnnw","nwnnw","wwnnn","nnwnw",
                   "wnwnn","nwwnn","nnnww","wnnwn","nwnwn"];
function decodeItf(runs, firstIsBar){
  let seq = runs.slice(firstIsBar ? 0 : 1);
  if(seq.length < 4 + 10) return null;
  // start guard is narrow bar/space/bar/space
  const body = seq.slice(4, seq.length - 3);
  if(body.length % 10 !== 0) {
    const trimmed = body.slice(0, Math.floor(body.length / 10) * 10);
    if(!trimmed.length) return null;
    body.length = trimmed.length;
  }
  const all = body;
  const mn = Math.min(...all), mx = Math.max(...all);
  if(mx / mn < 1.5) return null;
  const mid = (mn + mx) / 2;
  let text = "";
  for(let i = 0; i + 10 <= all.length; i += 10){
    const bars = [], spaces = [];
    for(let k = 0; k < 10; k++) (k % 2 === 0 ? bars : spaces).push(all[i + k] > mid ? "w" : "n");
    const a = ITF_DIGIT.indexOf(bars.join(""));
    const b = ITF_DIGIT.indexOf(spaces.join(""));
    if(a < 0 || b < 0) return null;
    text += a; text += b;
  }
  return text.length >= 4 ? {text, format: "itf"} : null;
}

/* widen a narrow crop so thin bars survive the run-length step */
function upscaleGray(gray, w, h, factor){
  const nw = Math.round(w * factor);
  const out = new Uint8ClampedArray(nw * h);
  for(let y = 0; y < h; y++)
    for(let x = 0; x < nw; x++)
      out[y*nw + x] = gray[y*w + Math.min(w - 1, Math.floor(x / factor))];
  return {gray: out, w: nw, h};
}

/* ---------- entry point ---------- */
/* Scan a handful of rows in both polarities; a code only counts once two
   independent rows agree, which stops a single noisy line from producing a
   confident wrong answer. Every symbology here is checksum-validated, so a
   miss is far more likely than a misread. */
function decodeBarcode1D(gray, w, h, opts){
  const votes = new Map();
  const passes = [{gray, w, h}];
  if(w < 700) passes.push(upscaleGray(gray, w, h, Math.ceil(700 / w)));

  for(const src of passes){
    scanPass(src.gray, src.w, src.h, votes, opts, false);
    if(!votes.size) scanPass(src.gray, src.w, src.h, votes, opts, true);   // white-on-dark labels
    if(votes.size) break;
  }
  let best = null;
  votes.forEach(v => { if(!best || v.n > best.n) best = v; });
  if(!best) return null;
  const need = (opts && opts.minVotes) || 2;
  if(best.n < need && !(opts && opts.lenient)) return null;
  return {text: best.text, format: best.format, votes: best.n};
}
function scanPass(gray, w, h, votes, opts, invert){
  const lines = (opts && opts.lines) || 15;
  for(let i = 0; i < lines; i++){
    const y = Math.floor((i + 0.5) * h / lines);
    let bin = binarizeRow(gray, w, h, y);
    if(!bin) continue;
    if(invert) for(let x = 0; x < w; x++) bin[x] = bin[x] ? 0 : 1;
    const ean = decodeEan(bin, w);
    if(ean) tally(votes, ean);
    const {runs, firstIsBar} = runsOfLine(bin, w);
    if(runs.length < 8) continue;
    const trimmed = trimQuiet(runs, firstIsBar);
    for(const fn of [decodeCode128, decodeCode39, decodeItf]){
      const r = fn(trimmed.runs, trimmed.firstIsBar);
      if(r) tally(votes, r);
    }
  }
}

function tally(map, r){
  const key = r.format + "|" + r.text;
  const cur = map.get(key);
  if(cur) cur.n++; else map.set(key, {text: r.text, format: r.format, n: 1});
}
/* drop the leading/trailing quiet zone so the first run is the first bar */
function trimQuiet(runs, firstIsBar){
  let r = runs.slice(), fb = firstIsBar;
  if(!fb){ r = r.slice(1); fb = true; }
  if(r.length && !((r.length - 1) % 2)) { /* ends on a bar, fine */ }
  else r = r.slice(0, -1);
  return {runs: r, firstIsBar: fb};
}

/* ---------------- OCR engine (Tesseract.js), loaded on demand --------- */
const TESS_URLS = [
  "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js",
  "https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"
];
let tessReady = null, tessWorker = null, tessLang = null;
function loadTesseract(){
  if(tessReady) return tessReady;
  tessReady = new Promise((resolve, reject) => {
    if(window.Tesseract) return resolve(window.Tesseract);
    let i = 0;
    const tryNext = () => {
      if(i >= TESS_URLS.length){
        tessReady = null;
        return reject(new Error(t("ocrErr")));
      }
      const sc = document.createElement("script");
      sc.src = TESS_URLS[i++];
      sc.onload = () => resolve(window.Tesseract);
      sc.onerror = tryNext;
      document.head.appendChild(sc);
    };
    setTimeout(() => { if(tessReady){ tessReady = null;
      reject(new Error(t("ocrErrTimeout"))); } }, 20000);
    tryNext();
  });
  return tessReady;
}
async function getTessWorker(lang){
  const T = await loadTesseract();
  if(tessWorker && tessLang === lang) return tessWorker;
  if(tessWorker){ try { await tessWorker.terminate(); } catch(e){} tessWorker = null; }
  tessWorker = await T.createWorker(lang || "eng");
  tessLang = lang;
  return tessWorker;
}
async function runOcr(canvas, params){
  const worker = await getTessWorker((params.lang || "eng").split("+")[0]);
  const opts = {};
  if(params.psm !== undefined && params.psm !== "") opts.tessedit_pageseg_mode = String(params.psm);
  if(params.whitelist) opts.tessedit_char_whitelist = params.whitelist;
  if(Object.keys(opts).length) await worker.setParameters(opts);
  const out = await worker.recognize(canvas);
  return {text: (out.data.text || "").trim(),
          conf: Math.max(0, Math.min(1, (out.data.confidence || 0) / 100))};
}

/* ---------------- model library, stored in this browser only ---------- */
const models = [];        // {id,name,type,size,conf,iou,names[],deploy,bytes,session}
let modelDB = null;
function openDB(){
  return new Promise(res => {
    if(modelDB) return res(modelDB);
    if(typeof indexedDB === "undefined") return res(null);
    let rq;
    try { rq = indexedDB.open("tesr_roi_studio", 1); } catch(e){ return res(null); }
    rq.onupgradeneeded = () => rq.result.createObjectStore("models", {keyPath:"id"});
    rq.onsuccess = () => { modelDB = rq.result; res(modelDB); };
    rq.onerror = () => res(null);
  });
}
async function dbPut(rec){
  const db = await openDB(); if(!db) return;
  // the live session object cannot be cloned into IndexedDB
  const {session, ...plain} = rec;
  try { db.transaction("models","readwrite").objectStore("models").put(plain); }
  catch(e){ /* private mode or quota: the model still works for this session */ }
}
async function dbDel(id){
  const db = await openDB(); if(!db) return;
  try { db.transaction("models","readwrite").objectStore("models").delete(id); } catch(e){}
}
async function dbAll(){
  const db = await openDB(); if(!db) return [];
  return new Promise(res => {
    try{
      const rq = db.transaction("models","readonly").objectStore("models").getAll();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => res([]);
    }catch(e){ res([]); }
  });
}

async function getSession(model){
  if(model.session) return model.session;
  const ort = await loadOrt();
  ort.env.wasm.numThreads = 1;          // works everywhere without COOP/COEP headers
  model.session = await ort.InferenceSession.create(model.bytes,
                    {executionProviders:["wasm"], graphOptimizationLevel:"all"});
  return model.session;
}

/* run one model over one crop canvas */
async function runModel(model, canvas){
  const ort = await loadOrt();
  const session = await getSession(model);
  const g = canvas.getContext("2d", {willReadFrequently:true});
  const img = g.getImageData(0, 0, canvas.width, canvas.height);
  const size = +model.size || (model.type === "classify" ? 224 : 640);
  const lb = letterbox(img.data, canvas.width, canvas.height, size);
  const feeds = {};
  feeds[session.inputNames[0]] = new ort.Tensor("float32", lb.data, [1, 3, size, size]);
  const res = await session.run(feeds);
  const out = res[session.outputNames[0]];
  if(model.type === "classify"){
    const c = decodeClassify(out.data, out.dims, model.names);
    return {items: [], value: c.name, conf: c.conf};
  }
  const items = decodeDetect(out.data, out.dims, lb,
                  {conf:+model.conf || 0.25, iou:+model.iou || 0.45, names: model.names});
  return {items, value: items.length,
          conf: items.length ? items.reduce((a,d) => a + d.conf, 0) / items.length : 0};
}

/* ==================================================================
   Frame source: a still reference image, or the live camera
   ================================================================== */
const live = {on:false, stream:null, video:null, infer:true, busy:false, last:0, results:{}};

function liveReady(){
  return live.on && live.video && live.video.readyState >= 2 && live.video.videoWidth > 0;
}
/* whatever the ROIs should currently be measured against */
function sourceEl(){ return liveReady() ? live.video : bgImage(); }
function sourceSize(){
  const el = sourceEl();
  if(!el) { const c = cam(); return {w:(c && c.width) || 1280, h:(c && c.height) || 720}; }
  return liveReady() ? {w: el.videoWidth, h: el.videoHeight}
                     : {w: el.naturalWidth, h: el.naturalHeight};
}

function cropRoiCanvas(roi, target){
  const el = sourceEl(); if(!el) return null;
  const p = rectPx(roi);
  let tw = Math.max(8, Math.round(p.w)), th = Math.max(8, Math.round(p.h));
  const up = roi.upscale_to || 0;
  if(up && th < up){ const sc = up / th; tw = Math.round(tw * sc); th = Math.round(th * sc); }
  tw = Math.min(tw, 2048); th = Math.min(th, 2048);
  const c = target || document.createElement("canvas");
  c.width = tw; c.height = th;
  const g = c.getContext("2d", {willReadFrequently:true});
  g.save(); g.translate(tw/2, th/2); g.scale(tw/p.w, th/p.h); g.rotate(-p.a); g.translate(-p.cx, -p.cy);
  g.drawImage(el, 0, 0); g.restore();
  return c;
}
function grayOf(c){
  const d = c.getContext("2d", {willReadFrequently:true}).getImageData(0,0,c.width,c.height).data;
  const out = new Uint8ClampedArray(c.width * c.height);
  for(let i = 0, j = 0; i < d.length; i += 4, j++)
    out[j] = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;   // same luma as cv2.COLOR_BGR2GRAY
  return out;
}

/* ---------------- camera control ---------------- */
async function listCameras(){
  try{
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    const sel = P("liveDevice"); const keep = sel.value;
    sel.innerHTML = "";
    devs.forEach((d, i) => { const o = document.createElement("option");
      o.value = d.deviceId; o.textContent = d.label || ("Camera " + i); sel.appendChild(o); });
    if(keep) sel.value = keep;
    return devs;
  }catch(e){ return []; }
}
async function startLive(deviceId){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    throw new Error(t("noCamApi"));
  stopLive();
  const want = {video: deviceId ? {deviceId:{exact:deviceId}} : {width:{ideal:1920}, height:{ideal:1080}}};
  live.stream = await navigator.mediaDevices.getUserMedia(want);
  const v = P("liveVideo");
  v.srcObject = live.stream; v.muted = true; v.playsInline = true;
  await v.play();
  live.video = v; live.on = true;
  await listCameras();
  const c = cam();
  if(c){ c.width = v.videoWidth; c.height = v.videoHeight; }
  state.view.fitted = false;
  renderAll(); fit();
}
function stopLive(){
  if(live.stream){ live.stream.getTracks().forEach(t => t.stop()); live.stream = null; }
  live.on = false; live.results = {};
}
window.addEventListener("beforeunload", stopLive);

function setMode(mode){
  const isLive = mode === "live";
  P("modeLive").classList.toggle("on", isLive);
  P("modeSnap").classList.toggle("on", !isLive);
  P("liveDevice").style.display = isLive ? "" : "none";
  P("btnFreeze").style.display = isLive ? "" : "none";
  P("liveInferWrap").style.display = isLive ? "flex" : "none";
  if(isLive){
    startLive(P("liveDevice").value || undefined)
      .then(() => toast(t("liveOn")))
      .catch(err => { setMode("snap"); toast(t("liveFail") + err.message); });
  } else {
    stopLive(); renderAll(); invalidate();
  }
}
P("modeLive").onclick = () => setMode("live");
P("modeSnap").onclick = () => setMode("snap");
P("liveDevice").onchange = () => { if(live.on) startLive(P("liveDevice").value).catch(e => toast(e.message)); };
P("chkLiveInfer").onchange = () => { live.infer = P("chkLiveInfer").checked; };
P("btnFreeze").onclick = () => {
  if(!liveReady()) return;
  const v = live.video, c = document.createElement("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  const url = c.toDataURL("image/jpeg", 0.9);
  setMode("snap");
  setBackground(url);
};

/* ---------------- live evaluation of every ROI ---------------- */
const qrDetector = (typeof BarcodeDetector !== "undefined")
  ? new BarcodeDetector({formats:["qr_code","code_128","code_39","ean_13"]}) : null;
const prevGray = {};

async function evalRoi(roi){
  const crop = cropRoiCanvas(roi);
  if(!crop) return null;
  const w = crop.width, h = crop.height;
  if(roi.task === "digits_7seg"){
    const r = readDigits(grayOf(crop), w, h, roi.params);
    let text = r.text;
    const dec = +roi.params.decimals || 0;
    if(dec > 0 && text.length > dec && !text.includes("?")) text = text.slice(0,-dec) + "." + text.slice(-dec);
    return {value: text || "—", conf: r.conf, bin: r, crop};
  }
  if(roi.task === "color_check"){
    const d = crop.getContext("2d",{willReadFrequently:true}).getImageData(0,0,w,h).data;
    const p = roi.params; let hit = 0;
    for(let i = 0; i < d.length; i += 4){
      const R = d[i]/255, G = d[i+1]/255, B = d[i+2]/255;
      const mx = Math.max(R,G,B), mn = Math.min(R,G,B), df = mx - mn;
      let H = 0;
      if(df){ H = mx===R ? 60*(((G-B)/df)%6) : mx===G ? 60*((B-R)/df+2) : 60*((R-G)/df+4); }
      if(H < 0) H += 360;
      const Hc = H/2, S = mx ? df/mx*255 : 0, V = mx*255;
      if(Hc>=p.h_min && Hc<=p.h_max && S>=p.s_min && S<=p.s_max && V>=p.v_min && V<=p.v_max) hit++;
    }
    const ratio = hit / (w*h);
    return {value: p.output === "ratio" ? +ratio.toFixed(3) : (ratio >= p.min_ratio), conf: ratio, crop};
  }
  if(roi.task === "presence_diff"){
    const g = grayOf(crop), key = roi.id, ref = prevGray[key];
    if(!ref || ref.length !== g.length){ prevGray[key] = g; return {value:false, conf:0, crop}; }
    let diff = 0;
    for(let i = 0; i < g.length; i++) if(Math.abs(g[i]-ref[i]) > (+roi.params.sensitivity||25)) diff++;
    if(roi.params.reference === "previous") prevGray[key] = g;
    const ratio = diff / g.length;
    return {value: ratio >= (+roi.params.min_ratio||0.05), conf: Math.min(1,ratio*5), crop};
  }
  if(roi.task === "barcode_qr"){
    const p = roi.params || {};
    // 1) the browser's own decoder when it exists — fastest and most accurate
    if(qrDetector){
      try{
        const codes = await qrDetector.detect(crop);
        if(codes.length) return {value: codes[0].rawValue, conf: 1, crop,
                                 note: t("readNative") + codes[0].format + ")"};
      }catch(e){ /* fall through to the bundled decoders */ }
    }
    const g = crop.getContext("2d", {willReadFrequently:true}).getImageData(0, 0, w, h);
    // 2) bundled QR decoder
    if(p.qr !== false && typeof jsQR === "function"){
      try{
        const r = jsQR(g.data, w, h, {inversionAttempts: "attemptBoth"});
        if(r && r.data) return {value: r.data, conf: 1, crop, note: t("readQrBuiltin")};
      }catch(e){}
    }
    // 3) bundled 1-D decoder
    if(p.barcode !== false){
      const gray = grayOf(crop);
      const r = decodeBarcode1D(gray, w, h, {lines: 15});
      if(r) return {value: r.text, conf: Math.min(1, r.votes / 6), crop,
                    note: t("readBcBuiltin") + r.format + t("readBcLines") + r.votes + t("readBcLines2")};
    }
    return {value:"", conf:0, crop, note: t("codeNotFound")};
  }
  if(roi.task === "ocr_text"){
    let img = crop;
    if(roi.params.preprocess){
      // feed Tesseract the same binary picture the runner would build
      const r = binarizeJS(grayOf(crop), w, h,
        {threshold_mode: roi.params.threshold_mode || "otsu",
         invert: !!roi.params.invert, blur: roi.params.blur || 3});
      const c2 = document.createElement("canvas");
      c2.width = w; c2.height = h;
      const g2 = c2.getContext("2d"), id = g2.createImageData(w, h);
      for(let i = 0; i < r.length; i++){
        const v = 255 - r[i];        // Tesseract expects dark text on a light page
        id.data[i*4] = v; id.data[i*4+1] = v; id.data[i*4+2] = v; id.data[i*4+3] = 255;
      }
      g2.putImageData(id, 0, 0);
      img = c2;
    }
    try{
      const r = await runOcr(img, roi.params);
      return {value: r.text, conf: r.conf, crop: img,
              note: r.text ? null : t("ocrNothing")};
    }catch(e){ return {value:"", conf:0, crop: img, note: e.message}; }
  }
  if(roi.task === "yolo_detect" || roi.task === "yolo_classify"){
    const m = models.find(x => x.id === (roi.model && roi.model.id));
    if(!m) return {value:null, conf:0, crop, note: t("noModelPicked")};
    try{
      const r = await runModel(m, crop);
      let value = r.value;
      if(roi.task === "yolo_detect" && roi.params.output === "classes")
        value = [...new Set(r.items.map(i => i.name))];
      return {value, conf: r.conf, items: r.items, crop};
    }catch(e){ return {value:null, conf:0, crop, note: t("modelRunFail") + e.message}; }
  }
  return {value:null, conf:0, crop, note: t("taskBrowserNo")};
}

async function evalAll(){
  const c = cam(); if(!c || live.busy) return;
  live.busy = true;
  try{
    for(const roi of c.rois){
      if(roi.enabled === false) continue;
      const r = await evalRoi(roi);
      if(r) live.results[roi.id] = r;
    }
  } finally { live.busy = false; invalidate(); }
}

let pvPending = false;
function updatePreview(){
  if(pvPending) return;
  pvPending = true;
  requestAnimationFrame(() => { pvPending = false; updatePreviewNow(); });
}
function updatePreviewNow(){
  const r = selRoi(); if(!r) return;
  if(!sourceEl()){
    P("pvValue").textContent = "—";
    P("pvConf").textContent = t("previewNeedSource");
    return;

  const crop = cropRoiCanvas(r, P("pvCrop"));

  if(r.task !== "digits_7seg"){

    const g = pvBin.getContext("2d");
    g.drawImage(crop, 0, 0);
    const res = live.results[r.id];
    if(res && res.items){
      g.strokeStyle = "#F30006"; g.lineWidth = 2; g.font = "12px monospace"; g.fillStyle = "#F30006";
      res.items.forEach(d => {
        g.strokeRect(d.box[0], d.box[1], d.box[2]-d.box[0], d.box[3]-d.box[1]);
        g.fillText(d.name + " " + d.conf.toFixed(2), d.box[0]+2, Math.max(11, d.box[1]-3));
      });
    }
    P("pvValue").textContent = res && res.value !== null && res.value !== ""
                              ? String(res.value) : "—";
    P("pvConf").textContent = res && res.note ? res.note
      : (res ? t("conf") + res.conf.toFixed(2) : t("hint_" + r.task) || t("hintDefault"));
    return;
  }

  const res = readDigits(grayOf(crop), w, h, r.params);
  pvBin.width = w; pvBin.height = h;
  const g = pvBin.getContext("2d"), img = g.createImageData(w, h);
  for(let i = 0; i < res.bin.length; i++){
    const v = res.bin[i];
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  g.putImageData(img, 0, 0);
  g.strokeStyle = "#E6CC81"; g.lineWidth = 1;
  res.boxes.forEach(b => g.strokeRect(b[0]+.5, b[1]+.5, b[2]-b[0]-1, b[3]-b[1]-1));

  let text = res.text;
  const dec = +r.params.decimals || 0;
  if(dec > 0 && text.length > dec && !text.includes("?")) text = text.slice(0,-dec) + "." + text.slice(-dec);
  P("pvValue").textContent = text || "—";
  P("pvConf").textContent = (text.includes("?") ? t("unreadSome") : "") +
    t("conf") + res.conf.toFixed(2) + (r.params.unit ? " · " + r.params.unit : "");
}

function showDiag(items, bandText){
  P("diagBand").textContent = bandText || "";
  const box = P("diagList"); box.innerHTML = "";
  items.forEach(n => {
    const d = document.createElement("div");
    d.className = "d " + n.level;
    const b = document.createElement("b"); b.textContent = n.msg;
    const sp = document.createElement("span"); sp.textContent = n.fix;
    d.appendChild(b); d.appendChild(sp);
    if(n.bar !== undefined){
      const bar = document.createElement("div"); bar.className = "band";
      const i = document.createElement("i"); i.style.width = Math.round(n.bar*100) + "%";
      bar.appendChild(i); d.appendChild(bar);
    }
    box.appendChild(d);
  });
}
function currentGray(){
  const r = selRoi(); if(!r) return null;
  const crop = cropRoiCanvas(r);
  if(!crop) return null;
  return {gray: grayOf(crop), w: crop.width, h: crop.height};
}
P("btnDiag").onclick = () => {
  const r = selRoi(), src = currentGray();
  if(!r || !src) return toast(t("needImage"));
  const res = readDigits(src.gray, src.w, src.h, r.params);
  const d = diagnose(src.gray, src.w, src.h, r.params, res);
  showDiag(d.notes, "sat " + (d.sat*100).toFixed(0) + "% · spread " + d.spread);
};
P("btnAutoTune").onclick = () => {
  const r = selRoi(), src = currentGray();
  if(!r || !src) return toast(t("needImage"));
  P("btnAutoTune").disabled = true;
  P("btnAutoTune").textContent = t("autoTuning");
  setTimeout(() => {
    let best = null;
    try{ best = autoTune(src.gray, src.w, src.h, r.params); }
    catch(e){ toast(t("tuneFailed") + e.message); }
    P("btnAutoTune").disabled = false;
    P("btnAutoTune").textContent = t("autoTune");

    if(!best){
      const res0 = readDigits(src.gray, src.w, src.h, r.params);
      const diag = diagnose(src.gray, src.w, src.h, r.params, res0);
      showDiag([{level:"bad", msg: t("tuneNoBand"), fix: t("tuneNoBandFix")}]
               .concat(diag.notes), t("tuneNone"));
      return;
    }
    Object.assign(r.params, {
      threshold_mode: best.params.threshold_mode, threshold: best.params.threshold,
      invert: best.params.invert, blur: best.params.blur,
      min_fill: +best.params.min_fill.toFixed(2), c: best.params.c
    });
    if(r.upscale_to === 0 && src.h < 90) r.upscale_to = 160;
    syncProps(); updatePreview(); invalidate();

    // re-measure with the parameters that are now actually in force
    const after = currentGray() || src;
    const resNow = readDigits(after.gray, after.w, after.h, r.params);
    const diag = diagnose(after.gray, after.w, after.h, r.params, resNow);

    const label = {high:t("bandHigh"), medium:t("bandMed"), low:t("bandLow"), none:t("bandNone")}[best.robust];
    const notes = [{
      level: best.robust === "high" ? "ok" : best.robust === "medium" ? "warn" : "bad",
      msg: t("tuneResult") + (best.result.text || "—") + t("tuneSafeBand") + label,
      fix: t("tuneApplied1") + best.params.threshold_mode +
           (best.params.threshold_mode === "fixed" ? " (" + best.params.threshold + ")" : "") +
           t("tuneApplied2") + (best.params.invert ? t("polDark") : t("polLight")) +
           t("tuneApplied3") + best.params.blur +
           t("tuneApplied4") + (+best.params.min_fill).toFixed(2) + t("tuneApplied5"),
      bar: Math.min(1, best.band / 0.3)
    }];
    if(!best.agrees) notes.push({level:"warn", msg: t("tuneMismatch"), fix: t("tuneMismatchFix")});
    showDiag(notes.concat(diag.notes),
             "band " + best.band.toFixed(2));
    toast(t("tuneDone"));
  }, 30);
};

function buildConfig(includeRef){
  return {
    schema: "tesr.roi.v1",
    project: P("projName").value.trim() || "TESR Vision Project",
    created: new Date().toISOString(),
    generator: "TESR ROI Studio 1.0",
    runtime: state.runtime,
    cameras: state.cameras.map(c => ({
      id: c.id, name: c.name, source: c.source, width: c.width, height: c.height, rotate: c.rotate || 0,
      reference_image: includeRef ? c.bg : null,
      rois: c.rois.map(r => {
        const o = {id:r.id, name:r.name, enabled:r.enabled !== false, task:r.task,
                   output_key:r.output_key || r.name, stable_frames:r.stable_frames || 1,
                   every_n_frames:r.every_n_frames || 1, upscale_to:r.upscale_to || 0,
                   rect:{x:+r.rect.x.toFixed(5), y:+r.rect.y.toFixed(5),
                         w:+r.rect.w.toFixed(5), h:+r.rect.h.toFixed(5), angle:+(r.rect.angle||0)},
                   params:r.params};
        if(r.model){
          const m = models.find(x => x.id === r.model.id);
          o.model = Object.assign({}, r.model);
          if(m){ o.model.path = m.deploy; o.model.class_names = m.names; o.model.imgsz = m.size; }
          delete o.model.id;             // browser-only handle, meaningless on the edge device
        }
        return o;
      })
    }))
  };
}
